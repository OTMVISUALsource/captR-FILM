<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Chronograph Camy</title>
<style>
:root{
  --bg:#0b0b0c;--s1:#141416;--s2:#1c1c1f;--s3:#26262a;--line:#2b2b30;
  --tx:#f1ede4;--mute:#8e8b84;--acc:#cdb48a;--acc-d:#3a2c15;--bad:#e5604d;--ok:#8fc78a;
  --r:14px;--tabh:62px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;overscroll-behavior:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{position:fixed;inset:0;overflow:hidden}
.screen{position:absolute;inset:0 0 calc(var(--tabh) + var(--sab)) 0;display:none;flex-direction:column;min-height:0}
.screen.active{display:flex}
.tabs{position:absolute;left:0;right:0;bottom:0;height:calc(var(--tabh) + var(--sab));padding-bottom:var(--sab);background:var(--bg);border-top:1px solid var(--line);display:flex;z-index:20}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);min-height:44px}
.tabs button[aria-selected=true]{color:var(--acc)}
.tabs button[aria-selected=true] svg{stroke-width:2.2}
.topbar{display:flex;align-items:center;gap:6px;padding:calc(var(--sat) + 6px) 10px 6px;min-height:54px}
.topbar .mark{flex:1;text-align:center;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--tx)}
.ib[aria-pressed=true]{color:var(--acc)}
.ib:disabled{opacity:.3}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;background:var(--s2);color:var(--tx);font-size:12.5px;letter-spacing:.04em;white-space:nowrap;border:1px solid transparent}
.chip[aria-pressed=true],.chip.on{border-color:var(--acc);color:var(--acc)}
.chip.fmt{font-family:var(--mono);font-size:11.5px;color:var(--mute);background:transparent;border:1px solid var(--line);height:28px;padding:0 10px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* camera */
.finder-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 0 4px}
.finder{position:relative;background:#000;overflow:hidden;max-width:100%;max-height:100%;width:100%;aspect-ratio:3/4;touch-action:none;border-radius:2px}
.finder canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.finder canvas.mirror{transform:scaleX(-1)}
.gridov{position:absolute;inset:0;pointer-events:none;display:none;background:
 linear-gradient(to right,transparent calc(33.33% - .5px),rgba(255,255,255,.35) calc(33.33% - .5px),rgba(255,255,255,.35) calc(33.33% + .5px),transparent calc(33.33% + .5px),transparent calc(66.66% - .5px),rgba(255,255,255,.35) calc(66.66% - .5px),rgba(255,255,255,.35) calc(66.66% + .5px),transparent calc(66.66% + .5px)),
 linear-gradient(to bottom,transparent calc(33.33% - .5px),rgba(255,255,255,.35) calc(33.33% - .5px),rgba(255,255,255,.35) calc(33.33% + .5px),transparent calc(33.33% + .5px),transparent calc(66.66% - .5px),rgba(255,255,255,.35) calc(66.66% - .5px),rgba(255,255,255,.35) calc(66.66% + .5px),transparent calc(66.66% + .5px))}
.gridov.on{display:block}
.reticle{position:absolute;width:74px;height:74px;margin:-37px 0 0 -37px;border:1.5px solid var(--acc);border-radius:6px;pointer-events:none;opacity:0;transform:scale(1.25)}
.reticle.show{opacity:1;transform:scale(1);transition:transform .18s,opacity .2s}
.reticle.fade{opacity:0;transition:opacity .6s .8s}
.countdown{position:absolute;inset:0;display:none;place-items:center;font-size:96px;font-weight:200;color:#fff;text-shadow:0 2px 20px #0008;pointer-events:none}
.countdown.on{display:grid}
.blink{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.blink.go{animation:blink .22s}
@keyframes blink{0%{opacity:.85}100%{opacity:0}}
.readout{display:flex;justify-content:space-between;gap:8px;padding:2px 14px 6px;font-size:11px;color:var(--mute);font-family:var(--mono);white-space:nowrap;overflow:hidden}
.readout span{overflow:hidden;text-overflow:ellipsis}
.sub{min-height:46px;display:flex;align-items:center;gap:8px;padding:0 12px;overflow-x:auto;scrollbar-width:none}
.sub::-webkit-scrollbar{display:none}
.strip{display:flex;gap:8px;padding:6px 12px;overflow-x:auto;scrollbar-width:none}
.strip>:first-child{margin-left:auto}.strip>:last-child{margin-right:auto}.strip>[hidden]{display:none}
.strip::-webkit-scrollbar{display:none}
.rail{display:flex;align-items:center;justify-content:space-between;padding:6px 28px 12px;height:100px}
.thumb-btn{width:56px;height:56px;border-radius:12px;background:var(--s2) center/cover no-repeat;border:1.5px solid var(--line);overflow:hidden;display:grid;place-items:center;color:var(--mute)}
.shutter{width:80px;height:80px;border-radius:50%;border:3px solid var(--tx);display:grid;place-items:center;transition:transform .08s}
.shutter i{display:block;width:62px;height:62px;border-radius:50%;background:var(--tx);transition:transform .08s,background .15s}
.shutter:active i{transform:scale(.88)}
.shutter:disabled{opacity:.45}
.shutter.timing i{background:var(--acc)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:9px;border-radius:5px;background:linear-gradient(to right,var(--acc) var(--p,50%),var(--s3) var(--p,50%))}
input[type=range]::-moz-range-track{height:9px;border-radius:5px;background:var(--s3)}
input[type=range]::-moz-range-progress{height:9px;border-radius:5px;background:var(--acc)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:46px;height:30px;border-radius:15px;background:#fff;margin-top:-10.5px;border:0;box-shadow:0 1px 8px #000a}
input[type=range]::-moz-range-thumb{width:46px;height:30px;border-radius:15px;background:#fff;border:0}
.gate{position:absolute;inset:0;background:var(--bg);z-index:5;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;gap:14px}
.gate.on{display:flex}
.gate h1{font-weight:300;font-size:26px;margin:6px 0 0;letter-spacing:.02em}
.gate p{color:var(--mute);margin:0;max-width:30ch}
.gate ul{list-style:none;padding:0;margin:6px 0;color:var(--mute);text-align:left;font-size:14px;display:grid;gap:8px}
.gate li::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--acc);margin-right:10px;vertical-align:middle}
.btn{height:48px;padding:0 24px;border-radius:24px;background:var(--acc);color:#1a1205;font-weight:600;letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--s2);color:var(--tx);font-weight:500}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{height:36px;padding:0 16px;font-size:13.5px}
/* pages */
.page-h{padding:calc(var(--sat) + 14px) 16px 8px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.page-h h2{margin:0;font-weight:300;font-size:28px;letter-spacing:.01em}
.page-h small{color:var(--mute);font-size:12px;display:block;margin-top:2px}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.filters{display:flex;gap:8px;padding:6px 16px 10px;overflow-x:auto;scrollbar-width:none}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:0 0 12px}
@media(min-width:620px){.grid{grid-template-columns:repeat(5,1fr)}}
.grid.list{grid-template-columns:1fr;gap:1px}
.tile{position:relative;aspect-ratio:1;background:var(--s1) center/cover no-repeat;border:0;display:block;width:100%}
.list .tile{aspect-ratio:auto;height:72px;background:var(--s1);display:flex;align-items:center;gap:12px;text-align:left;padding:8px 16px}
.list .tile .th{width:56px;height:56px;border-radius:8px;background:center/cover;flex:none}
.tile .th{position:absolute;inset:0;background:center/cover no-repeat}
.list .tile .th{position:static}
.tile .meta{display:none}
.list .tile .meta{display:block;font-size:13px}
.list .tile .meta b{display:block;font-weight:500}
.list .tile .meta span{color:var(--mute);font-size:12px}
.badge{position:absolute;left:5px;bottom:5px;display:flex;gap:4px}
.list .badge{position:static}
.badge span{background:#000a;border-radius:4px;padding:1px 5px;font-size:10px;font-family:var(--mono);color:var(--tx)}
.tile .sel{position:absolute;right:6px;top:6px;width:22px;height:22px;border-radius:50%;border:2px solid #fff;background:#0006;display:none;place-items:center;color:#1a1205}
.selecting .tile .sel{display:grid}
.tile.picked .sel{background:var(--acc);border-color:var(--acc)}
.tile.picked::after{content:"";position:absolute;inset:0;border:3px solid var(--acc);pointer-events:none}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:60px 32px;text-align:center;color:var(--mute)}
.empty h3{color:var(--tx);font-weight:300;font-size:20px;margin:0}
.actionbar{display:none;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--s1);justify-content:space-around}
.selecting+.actionbar{display:flex}
.looklist{padding:0 12px 20px;display:grid;gap:10px}
.lookcard{display:flex;gap:12px;background:var(--s1);border-radius:var(--r);padding:10px;align-items:center;border:1px solid transparent;text-align:left;width:100%}
.lookcard.active{border-color:var(--acc)}
.lookcard canvas{width:84px;height:84px;border-radius:10px;flex:none;background:#000}
.lookcard .t{flex:1;min-width:0}
.lookcard b{font-weight:500;display:block}
.lookcard small{color:var(--mute);display:block;font-size:12.5px}
.lookcard .tag{color:var(--acc);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.sec-h{padding:14px 16px 6px;color:var(--mute);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.set{margin:0 12px 10px;background:var(--s1);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;min-height:50px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row:last-child{border:0}
.row .l{flex:1;min-width:0}
.row small{display:block;color:var(--mute);font-size:12.5px;margin-top:2px}
.sw{width:50px;height:30px;border-radius:15px;background:var(--s3);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
[aria-checked=true].sw{background:var(--acc)}
[aria-checked=true].sw::after{transform:translateX(20px)}
select{background:var(--s2);color:var(--tx);border:0;border-radius:8px;padding:8px 10px;font:inherit}
.caps{font-family:var(--mono);font-size:12px;color:var(--mute);padding:12px 14px;white-space:pre-wrap;line-height:1.6}
/* editor */
.overlay{position:absolute;inset:0;background:var(--bg);z-index:40;display:none;flex-direction:column}
.overlay.on{display:flex}
.ed-top{display:flex;align-items:center;gap:2px;padding:calc(var(--sat) + 4px) 6px 4px}
.ed-top .sp{flex:1}
.ed-stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:4px 0;touch-action:none;user-select:none;-webkit-user-select:none}
.ed-stage canvas{max-width:100%;max-height:100%;object-fit:contain;display:block}
.ed-tag{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#000b;padding:3px 12px;border-radius:12px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;display:none}
.ed-tag.on{display:block}
.ed-spin{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);background:var(--bg)}
.ed-bottom{background:var(--s1);border-top:1px solid var(--line);padding-bottom:var(--sab)}
.ed-actions{display:flex;gap:6px;padding:8px 10px 0;align-items:center;overflow-x:auto;scrollbar-width:none}
.ed-actions .sp{flex:1}
.ed-panel{height:min(40vh,330px);overflow-y:auto;padding:4px 14px 8px}
.ed-panel.looks{display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;align-items:flex-start;padding-top:12px}
.ed-tabs{display:flex;border-top:1px solid var(--line)}
.ed-tabs button{flex:1;min-height:48px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.ed-tabs button[aria-selected=true]{color:var(--acc);box-shadow:inset 0 2px 0 var(--acc)}
.sl{padding:2px 0}
.sl .lab{display:flex;justify-content:flex-start;align-items:baseline;gap:10px;font-size:16px;padding-top:6px;color:var(--tx)}
.sl .lab button{color:var(--tx)}
.sl .lab .v{font-size:16px;color:var(--mute);font-variant-numeric:tabular-nums}
.sl .lab .v.mod{color:var(--acc)}
.lk{flex:none;width:86px;text-align:center;font-size:11.5px;color:var(--mute)}
.lk canvas{width:86px;height:86px;border-radius:10px;display:block;border:2px solid transparent;background:#000}
.lk.on canvas{border-color:var(--acc)}
.lk.on{color:var(--acc)}
.lk span{display:block;margin-top:5px;line-height:1.2}
.pills{display:flex;gap:8px;flex-wrap:wrap;padding:10px 0}
.subpills{display:flex;gap:10px;padding:10px 0 2px}.pill{height:40px;padding:0 24px;border-radius:20px;background:var(--s2);font-size:17px}.pill.on{background:#fff;color:#111}
.tg{padding:12px 0;border:0}.tg .l{font-size:16px}.tgh{color:var(--mute);font-size:12px;margin:0 0 6px}
.fab{width:58px;height:58px;border-radius:50%;background:var(--acc);color:#1a1205;display:grid;place-items:center;flex:none;margin:6px 10px 8px 4px}
.ed-tabs{align-items:center}.ed-tabs button.t{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;letter-spacing:.02em;text-transform:none;padding:8px 0;box-shadow:none!important}.ed-tabs button.t[aria-selected=true]{color:var(--acc)}
/* sheet + toast */
.scrim{position:absolute;inset:0;background:#000a;z-index:60;display:none;align-items:flex-end}
.scrim.on{display:flex}
.sheet{width:100%;background:var(--s1);border-radius:20px 20px 0 0;padding:18px 18px calc(18px + var(--sab));max-height:85%;overflow:auto;border-top:1px solid var(--line)}
.sheet h3{margin:0 0 4px;font-weight:400;font-size:19px}
.sheet p{color:var(--mute);margin:4px 0 12px}
.sheet .acts{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.sheet .acts .btn{flex:1;min-width:120px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px;margin-top:8px}
.kv dt{color:var(--mute)}.kv dd{margin:0;word-break:break-word}
.toast{position:absolute;left:50%;bottom:calc(var(--tabh) + var(--sab) + 16px);transform:translate(-50%,20px);background:var(--s3);padding:10px 16px;border-radius:20px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:88%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.prog{height:3px;background:var(--s3);border-radius:2px;overflow:hidden;margin:10px 0}
.prog i{display:block;height:100%;width:30%;background:var(--acc);animation:slide 1s infinite linear}
@keyframes slide{0%{margin-left:-30%}100%{margin-left:100%}}
.hidden{display:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">

  <!-- CAMERA -->
  <section class="screen active" id="s-camera" aria-label="Camera">
    <div class="topbar">
      <button class="ib" id="b-flash" aria-label="Flash" hidden></button>
      <button class="chip fmt" id="b-fmt" aria-label="Capture format details">JPEG</button>
      <div class="mark">Chronograph Camy</div>
      <button class="ib" id="b-grid" aria-label="Grid overlay" aria-pressed="false"></button>
      <button class="ib" id="b-settings" aria-label="Settings"></button>
    </div>
    <div class="finder-wrap">
      <div class="finder" id="finder">
        <canvas id="camCanvas" aria-label="Live viewfinder"></canvas>
        <div class="gridov" id="gridov"></div>
        <div class="reticle" id="reticle"></div>
        <div class="countdown" id="countdown" aria-live="assertive"></div>
        <div class="blink" id="blink"></div>
      </div>
    </div>
    <div class="readout mono" id="readout" aria-live="polite"><span id="ro-l">—</span><span id="ro-r">—</span></div>
    <div class="sub" id="sub"></div>
    <div class="strip" id="strip">
      <button class="chip" id="c-aspect" aria-pressed="false"></button>
      <button class="chip" id="c-timer" aria-pressed="false"></button>
      <button class="chip" id="c-look" aria-pressed="false"></button>
      <button class="chip" id="c-ev" aria-pressed="false"></button>
      <button class="chip" id="c-zoom" aria-pressed="false" hidden></button>
    </div>
    <div class="rail">
      <button class="thumb-btn" id="b-last" aria-label="Open latest photo"></button>
      <button class="shutter" id="b-shutter" aria-label="Take photo"><i></i></button>
      <button class="ib" id="b-flip" aria-label="Switch camera" style="width:56px;height:56px;background:var(--s2)"></button>
    </div>
    <div class="gate" id="gate"></div>
  </section>

  <!-- LIBRARY -->
  <section class="screen" id="s-library" aria-label="Library">
    <div class="page-h"><div><h2>Library</h2><small id="lib-count"></small></div>
      <div style="display:flex;gap:2px">
        <button class="ib" id="l-import" aria-label="Import photos"></button>
        <button class="ib" id="l-view" aria-label="Toggle grid or list"></button>
        <button class="ib" id="l-select" aria-label="Select photos"></button>
      </div></div>
    <div class="filters" id="l-filters"></div>
    <div class="scroll" id="l-scroll"><div class="grid" id="l-grid"></div></div>
    <div class="actionbar" id="l-actions"></div>
    <input type="file" id="importInput" accept="image/*,.heic,.heif,.tif,.tiff,.dng,.cr2,.cr3,.nef,.nrw,.arw,.orf,.rw2,.raf,.pef,.srw,.3fr,.erf,.kdc,.mrw,.x3f,.dcr,.rwl,.iiq,.avif,.webp,.bmp,.gif,.svg,.ico" multiple hidden>
  </section>

  <!-- LOOKS -->
  <section class="screen" id="s-looks" aria-label="Looks">
    <div class="page-h"><div><h2>Looks</h2><small>Rendering profiles. The active look is used live on camera.</small></div></div>
    <div class="scroll"><div class="sec-h">Built-in</div><div class="looklist" id="look-built"></div>
    <div class="sec-h" id="custom-h">Your looks</div><div class="looklist" id="look-custom"></div></div>
  </section>

  <!-- SETTINGS -->
  <section class="screen" id="s-settings" aria-label="Settings">
    <div class="page-h"><div><h2>Settings</h2></div></div>
    <div class="scroll" id="set-body"></div>
  </section>

  <nav class="tabs" role="tablist" aria-label="Main">
    <button role="tab" data-tab="camera" aria-selected="true"></button>
    <button role="tab" data-tab="library" aria-selected="false"></button>
    <button role="tab" data-tab="looks" aria-selected="false"></button>
    <button role="tab" data-tab="settings" aria-selected="false"></button>
  </nav>

  <!-- EDITOR -->
  <div class="overlay" id="editor" role="dialog" aria-label="Develop photo">
    <div class="ed-top">
      <button class="ib" id="e-close" aria-label="Close"></button>
      <button class="ib" id="e-undo" aria-label="Undo"></button>
      <button class="ib" id="e-redo" aria-label="Redo"></button>
      <div class="sp"></div>
      <button class="ib" id="e-fav" aria-label="Favorite" aria-pressed="false"></button>
      <button class="ib" id="e-info" aria-label="Photo info"></button>
    </div>
    <div class="ed-stage" id="e-stage">
      <canvas id="edCanvas" aria-label="Photo preview. Press and hold to see the original."></canvas>
      <div class="ed-tag" id="e-tag">Original</div>
      <div class="ed-spin" id="e-spin">Developing…</div>
    </div>
    <div class="ed-bottom">
      <div class="ed-actions">
        <button class="chip" id="e-cmp" aria-label="Hold to compare with original" title="Hold to compare"></button>
        <span class="sp"></span>
        <button class="chip" id="e-copy"></button>
        <button class="chip" id="e-paste"></button>
        <button class="chip" id="e-savelook">Save look</button>
        <button class="chip" id="e-reset">Reset</button>
      </div>
      <div class="ed-panel" id="e-panel"></div>

async function renderPhotoBlob(id,opts){
  const [p,o]=[S.lib.find(x=>x.id===id),await DB.get('orig',id)];
  const {img,url}=await loadImage(o.blob);
  try{
    const R=new Renderer(document.createElement('canvas'));let src=img,sw=img.naturalWidth,sh=img.naturalHeight,note='';
    if(Math.max(sw,sh)>R.maxTex){src=scaledCanvas(img,R.maxTex);sw=src.width;sh=src.height;note='Downscaled to fit this device’s GPU limit.'}

    const native=Math.max(cr.pw,cr.ph),long=opts.size==='full'?native:Math.min(native,+opts.size);

    const bar=document.createElement('div');bar.style.cssText='display:flex;flex-direction:column;gap:2px';
    const mk=(icn,label,fn,on)=>{const x=document.createElement('button');x.className='ib';x.setAttribute('aria-label',label);x.innerHTML=ic(icn,20);if(on){x.style.color='var(--acc)';x.firstElementChild.style.fill='currentColor'}x.onclick=e=>{e.stopPropagation();fn()};bar.appendChild(x)};
    mk('star',fav?'Unfavorite':'Favorite',()=>{fav?S.favLooks.delete(l.id):S.favLooks.add(l.id);store.set('favLooks',[...S.favLooks]);renderLooks()},fav);
    if(l.custom){mk('pencil','Rename',async()=>{const n=await promptSheet('Rename look',l.name,'Rename');if(n){l.name=n;store.set('customLooks',S.customLooks);renderLooks()}});
      mk('trash','Delete',async()=>{if(await confirmSheet('Delete look?',`“${l.name}” will be removed. Photos already using it keep their settings.`,'Delete',true)){S.customLooks=S.customLooks.filter(x=>x.id!==l.id);if(S.camLook===l.id){S.camLook='neutral';store.set('camLook','neutral')}store.set('customLooks',S.customLooks);renderLooks()}})}
    b.appendChild(bar);
    b.style.cursor='pointer';b.onclick=()=>{S.camLook=l.id;store.set('camLook',l.id);haptic(8);renderLooks();updateCamUI();toast(l.name+' is now your camera look')};
    host.appendChild(b)})};
  const sortFav=a=>a.slice().sort((x,y)=>(S.favLooks.has(y.id)-S.favLooks.has(x.id)));
  draw($('#look-built'),sortFav(LOOKS));draw($('#look-custom'),sortFav(S.customLooks));
  $('#custom-h').style.display=$('#look-custom').style.display=S.customLooks.length?'':'none';
}

/* ---------- settings ---------- */
function renderSettings(){
  const b=$('#set-body');
  const sw=(k,label,sub)=>`<button class="row" data-sw="${k}"><span class="l">${label}${sub?`<small>${sub}</small>`:''}</span><span class="sw" role="switch" aria-checked="${!!S.set[k]}"></span></button>`;
  const canFull=cam.ic&&typeof cam.ic.takePhoto==='function';
  b.innerHTML=`
  <div class="sec-h">Capture</div><div class="set">
    ${sw('fullres','Full-resolution stills',canFull?'Uses the camera’s still-photo mode when available.':'Not supported by this browser. Frames are grabbed from the video stream.')}
    <div class="row"><span class="l">Grid overlay</span><span class="sw" role="switch" aria-checked="${S.grid}" id="sw-grid" tabindex="0"></span></div>
    ${sw('haptics','Haptics','Vibration on shutter and focus (not available on iPhone Safari).')}
  </div>
  <div class="sec-h">Camera capabilities</div><div class="set"><div class="caps" id="caps"></div></div>
  <div class="sec-h">Storage & privacy</div><div class="set">
    <div class="row"><span class="l">Library storage<small id="st-use">Calculating…</small></span></div>
    <button class="row" id="st-persist"><span class="l">Keep my photos safe<small>Ask the browser not to clear this app’s data when space is low.</small></span>${ic('check',18)}</button>
    <div class="row"><span class="l">Privacy<small>Everything stays on this device. No account, no uploads, no analytics. Exports never include location.</small></span></div>
  </div>
  <div class="sec-h">About this build</div><div class="set">
    <div class="row"><span class="l">What’s different from the iPhone app<small>This is a web app. It can’t capture RAW or Apple ProRAW, and browsers decide which lenses, focus and exposure controls exist. Only controls your camera exposes are shown. Rendering runs on your GPU (WebGL, 8-bit working space).</small></span></div>
    <button class="row" id="st-clear"><span class="l" style="color:var(--bad)">Delete all photos and looks<small>Removes everything stored by Chronograph Camy on this device.</small></span></button>
  </div>
  <div style="height:24px"></div>`;
  $$('[data-sw]',b).forEach(r=>r.onclick=()=>{const k=r.dataset.sw;S.set[k]=!S.set[k];saveSet();renderSettings();updateCamUI()});
  $('#sw-grid').onclick=()=>{S.grid=!S.grid;store.set('grid',S.grid);renderSettings();updateCamUI()};
  const lines=[];
  if(cam.state==='live'){const c=cam.caps,st=cam.st;
    lines.push('Camera   '+((cam.track&&cam.track.label)||'—'),`Stream   ${video.videoWidth}×${video.videoHeight}${st.frameRate?' @ '+Math.round(st.frameRate)+'fps':''}`,
      'Still    '+(canFull?'full-res (ImageCapture)':'video frame only'),'RAW      not available (web)',
      'Zoom     '+(c.zoom?`${c.zoom.min}–${c.zoom.max}×`:'—'),'Torch    '+(c.torch?'yes':'—'),'Focus    '+(c.focusMode?c.focusMode.join(', '):'—'),
      'EV comp  '+(c.exposureCompensation?`${c.exposureCompensation.min} to ${c.exposureCompensation.max} (hardware)`:'digital only'),
      'Lenses   '+(cam.devices.length||'—')+' video input'+(cam.devices.length===1?'':'s'));
  }else lines.push('Camera not active.');
  $('#caps').textContent=lines.join('\n');
  if(navigator.storage&&navigator.storage.estimate)navigator.storage.estimate().then(e=>{$('#st-use').textContent=`${fmtBytes(e.usage||0)} used of ${fmtBytes(e.quota||0)} available`}).catch(()=>{$('#st-use').textContent='Unknown'});else $('#st-use').textContent='Unknown';
  $('#st-persist').onclick=async()=>{if(navigator.storage&&navigator.storage.persist){const ok=await navigator.storage.persist();toast(ok?'Storage will be kept':'The browser declined')}else toast('Not supported here')};
  $('#st-clear').onclick=async()=>{if(await confirmSheet('Delete everything?','All photos, edits and custom looks in Chronograph Camy will be removed from this device. This can’t be undone.','Delete all',true)){for(const p of S.lib.slice())await deletePhoto(p.id);S.customLooks=[];store.set('customLooks',[]);S.camLook='neutral';store.set('camLook','neutral');renderLibrary();renderLooks();updateCamUI();toast('All data deleted')}};
}

/* ---------- tabs ---------- */
function switchTab(t){
  if(S.tab==='camera'&&t!=='camera'&&cam.stream){stopCamera()}
  S.tab=t;
  $$('.screen').forEach(s=>s.classList.toggle('active',s.id==='s-'+t));
  $$('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t));
  if(t==='camera'){if(store.get('onboarded',false)&&cam.state!=='live')startCamera();updateCamUI()}
  if(t==='library')renderLibrary();if(t==='looks')renderLooks();if(t==='settings')renderSettings();
}
const TABS={camera:['camera','Camera'],library:['images','Library'],looks:['looks','Looks'],settings:['gear','Settings']};
$$('.tabs button').forEach(b=>{const [i,l]=TABS[b.dataset.tab];b.innerHTML=ic(i)+'<span>'+l+'</span>';b.onclick=()=>switchTab(b.dataset.tab)});
addEventListener('keydown',e=>{if(e.code==='Space'&&S.tab==='camera'&&!E.open&&!/INPUT|SELECT|BUTTON/.test(document.activeElement.tagName)){e.preventDefault();$('#b-shutter').click()}if(e.key==='Escape'){if($('#scrim').classList.contains('on'))closeSheet();else if(E.open)closeEditor()}});

/* ---------- boot ---------- */
(async()=>{
  updateCamUI();renderLooks();
  await loadLibrary();
  requestAnimationFrame(camLoop);
  if(cam.noGL){setGate('nogl');return}
  let granted=false;
  try{if(navigator.permissions&&navigator.permissions.query){const r=await navigator.permissions.query({name:'camera'});granted=r.state==='granted'}}catch{}
  if(granted||store.get('onboarded',false))startCamera();else setGate('intro');
})();
window.__camy={S,cam,E};
})();
</script>
</body>
</html>
